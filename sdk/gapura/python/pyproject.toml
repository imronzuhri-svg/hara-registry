[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hara-gapura"
version = "0.1.0"
description = "Python client SDK for the HARA Gapura Gateway (anchoring, identity, metering)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "HARA Ops", email = "ops@haratrust.io" }]
keywords = ["hara", "gapura", "anchoring", "did", "eudr", "registry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["requests>=2.31"]

[project.urls]
Homepage = "https://haratrust.io"
Documentation = "https://gapura.ledger.haratrust.io"

[tool.hatch.build.targets.wheel]
packages = ["src/hara_gapura"]

[tool.hatch.build.targets.wheel.force-include]
"src/hara_gapura/py.typed" = "hara_gapura/py.typed"
