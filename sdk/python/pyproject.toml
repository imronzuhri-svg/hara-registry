[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hara-registry"
version = "0.1.0"
description = "Official Python SDK for Hara Registry — a permissioned Hyperledger Besu (QBFT) chain for palm-oil supply-chain traceability with post-quantum audit anchoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Hara Trust", email = "ops@haratrust.io" }]
keywords = ["hara", "blockchain", "besu", "erc1155", "traceability", "palm-oil", "web3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "web3>=6",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.5", "types-requests"]

[project.urls]
Homepage = "https://github.com/imronzuhri-svg/hara-registry"
Repository = "https://github.com/imronzuhri-svg/hara-registry"
Documentation = "https://github.com/imronzuhri-svg/hara-registry/blob/main/doc/api/hara-registry-facts.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hara_registry = ["py.typed"]
