name: codeql

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"  # Weekly, Monday 04:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    # CodeQL "advanced" workflows (this file) cannot coexist with CodeQL
    # "default setup" — GitHub rejects SARIF uploads from advanced workflows
    # with "CodeQL analyses from advanced configurations cannot be processed
    # when the default setup is enabled."
    #
    # Today (2026-05-19) the repo runs default setup (configured in repo
    # Settings → Code security and analysis), which covers JavaScript /
    # TypeScript scans automatically. This advanced workflow stays in tree
    # for the day we want custom queries / extra languages / a tighter
    # cadence than the weekly default — opt in by setting the repo variable:
    #
    #   gh variable set HARA_ADVANCED_CODEQL --body "true" \
    #     --repo imronzuhri-svg/hara-ledger
    #
    # AND disable default setup in the same Settings page. Without both,
    # this job is a no-op.
    if: vars.HARA_ADVANCED_CODEQL == 'true'
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
        # Note: CodeQL has no official Solidity analyzer; for Solidity static
        # analysis, see slither.yml (separate workflow).

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Auto-build
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
