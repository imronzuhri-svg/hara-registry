name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"  # Weekly, Monday 04:30 UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    # CodeQL on private repos needs GitHub Advanced Security (paid per
    # committer). Skip the job until the repo is public OR GHAS is enabled —
    # otherwise the upload step always fails with "Code scanning is not
    # enabled for this repository." The workflow stays in tree so it
    # auto-resumes once visibility flips.
    if: github.event.repository.visibility == 'public' || vars.HARA_GHAS_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
        # Note: CodeQL has no official Solidity analyzer; for Solidity static
        # analysis, see slither.yml (separate workflow).

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Auto-build
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
