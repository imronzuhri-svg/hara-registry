name: echidna

# Property-based fuzz testing for the contracts. Catches invariant
# violations Slither cannot reason about — specifically HaraPalmOil's
# mass-balance invariant across arbitrary transfer chains.
#
# Always runs on every PR so `echidna-gate` always reports (required-checkable).
# The fuzz job stays path-gated on PRs/pushes via `changes`, but ALWAYS runs on
# the weekly schedule and on manual dispatch (deep runs).
#
# Runs:
#   • on PRs/pushes touching contracts/**  (10k iterations)
#   • weekly cron (Sunday 06:00 UTC)       (200k iterations)
#   • manual dispatch                      (operator-chosen budget)

on:
  workflow_dispatch:
    inputs:
      testLimit:
        description: "Fuzz iterations per contract (default: 10000)"
        required: false
        default: "10000"
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sunday 06:00 UTC — nightly-ish deep run with longer test budget
    - cron: "0 6 * * 0"

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.f.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            contracts:
              - "contracts/**"
              - ".github/workflows/echidna.yml"

  fuzz:
    name: ${{ matrix.harness }}
    needs: changes
    # Path-gated on PRs/pushes; always run for scheduled + manual deep runs.
    if: >-
      needs.changes.outputs.contracts == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: HaraPalmOilFuzz
            path: test-fuzz/HaraPalmOilFuzz.sol

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install contract deps (forge-std + OZ via git, matching slither.yml)
        working-directory: contracts
        run: |
          mkdir -p lib
          [ -d lib/forge-std ] || git clone --depth 1 \
            https://github.com/foundry-rs/forge-std.git lib/forge-std
          [ -d lib/openzeppelin-contracts ] || git clone --depth 1 --branch v5.1.0 \
            https://github.com/OpenZeppelin/openzeppelin-contracts.git \
            lib/openzeppelin-contracts

      - name: Build contracts
        working-directory: contracts
        run: forge build

      # Schedule runs get a higher iteration budget — same harness, longer
      # search. Workflow-dispatch lets an operator pick any value.
      - name: Set test budget
        id: budget
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "limit=200000" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "limit=${{ inputs.testLimit }}" >> "$GITHUB_OUTPUT"
          else
            echo "limit=10000" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Echidna on ${{ matrix.harness }}
        uses: crytic/echidna-action@v2
        with:
          # Specific file path (passing a dir gives "contract not found").
          files: contracts/${{ matrix.path }}
          contract: ${{ matrix.harness }}
          # Match the config's testMode = property — first run reported the
          # deploy as the only failure because assertion mode skips the
          # `echidna_*` return-bool checks entirely.
          test-mode: property
          config: contracts/echidna.config.yaml
          test-limit: ${{ steps.budget.outputs.limit }}
          solc-version: 0.8.26

  echidna-gate:
    name: echidna-gate
    needs: [changes, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on fuzz result
        run: |
          r="${{ needs.fuzz.result }}"
          echo "fuzz result: $r (contracts changed: ${{ needs.changes.outputs.contracts }})"
          if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
            echo "::error::echidna fuzz failed"
            exit 1
          fi
          echo "echidna-gate passed"
