name: services

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - ".github/workflows/services.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/services.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: services

jobs:
  typecheck:
    name: typecheck + build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [shared, signer, broadcaster, indexer, migrate, rpc-cache]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: services/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: TypeCheck ${{ matrix.package }}
        # `tsc -b` respects project references (broadcaster/indexer/etc. ref
        # @hara/shared via composite). `tsc --noEmit` alone fails with TS6305
        # because the referenced .d.ts hasn't been built yet.
        run: |
          cd ${{ matrix.package }}
          if [ -f tsconfig.json ]; then
            pnpm exec tsc -b
          fi

  docker:
    name: docker build smoke (no push)
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      matrix:
        package: [signer, broadcaster, indexer, migrate, rpc-cache]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.package }} image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/${{ matrix.package }}/Dockerfile
          push: false
          load: true
          tags: hara-ledger-${{ matrix.package }}:ci
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,scope=${{ matrix.package }},mode=max
