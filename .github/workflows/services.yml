name: services

# Always runs on every PR so `services-gate` always reports (required-checkable).
# The expensive typecheck/build/scan/sign matrix stays path-gated via `changes`.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write       # push images to GHCR
  id-token: write       # cosign keyless OIDC

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.f.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            services:
              - "services/**"
              - ".github/workflows/services.yml"

  typecheck:
    name: typecheck + build
    needs: changes
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services

    strategy:
      matrix:
        package: [shared, signer, broadcaster, indexer, migrate, rpc-cache, anchor-worker]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: services/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: TypeCheck ${{ matrix.package }}
        # `tsc -b` respects project references (broadcaster/indexer/etc. ref
        # @hara/shared via composite). `tsc --noEmit` alone fails with TS6305
        # because the referenced .d.ts hasn't been built yet.
        run: |
          cd ${{ matrix.package }}
          if [ -f tsconfig.json ]; then
            pnpm exec tsc -b
          fi

  docker:
    name: docker build + scan + sign
    needs: [changes, typecheck]
    if: needs.changes.outputs.services == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    strategy:
      fail-fast: false
      matrix:
        package: [signer, broadcaster, indexer, migrate, rpc-cache, anchor-worker]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Push only on main branch pushes. PRs and dispatch builds stay local
      # (load: true) so they're scannable but not published. Avoids GHCR
      # clutter from PR iterations while still proving the build works.
      - name: Decide push mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "push=true"  >> "$GITHUB_OUTPUT"
            echo "load=false" >> "$GITHUB_OUTPUT"
            echo "tag=ghcr.io/${{ github.repository_owner }}/hara-registry-${{ matrix.package }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag_latest=ghcr.io/${{ github.repository_owner }}/hara-registry-${{ matrix.package }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "load=true"  >> "$GITHUB_OUTPUT"
            echo "tag=hara-registry-${{ matrix.package }}:ci" >> "$GITHUB_OUTPUT"
            echo "tag_latest=" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.package }} image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/${{ matrix.package }}/Dockerfile
          push: ${{ steps.mode.outputs.push }}
          load: ${{ steps.mode.outputs.load }}
          tags: |
            ${{ steps.mode.outputs.tag }}
            ${{ steps.mode.outputs.tag_latest }}
          cache-from: type=gha,scope=${{ matrix.package }}
          cache-to: type=gha,scope=${{ matrix.package }},mode=max

      # ── #3: Trivy CVE scan ─────────────────────────────────────────────
      # Fails the build on HIGH/CRITICAL findings. Scans the local image
      # (load:true on PRs, the just-pushed image on main).
      # Gate: CRITICAL,HIGH. Allowlist lives in .trivyignore — currently
      # ~22 CVEs, all in build-time tooling (npm + corepack-cached pnpm +
      # node-tar bundled in those) that the runtime carries but never
      # invokes. Each entry justified per-CVE in that file's preamble.
      # Will obsolete when multi-stage distroless builds land (separate task).
      - name: Trivy CVE scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.mode.outputs.tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library
          trivyignores: .trivyignore

      # ── #2: Sigstore keyless signing ───────────────────────────────────
      # Only on main pushes (when the image exists in GHCR). Uses GitHub OIDC
      # identity → Sigstore Fulcio for the cert, no long-lived secrets.
      - name: Install cosign
        if: steps.mode.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Cosign sign ${{ matrix.package }} image
        if: steps.mode.outputs.push == 'true'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          REPO="ghcr.io/${{ github.repository_owner }}/hara-registry-${{ matrix.package }}"
          cosign sign --yes "${REPO}@${DIGEST}"
          echo "✓ signed ${REPO}@${DIGEST}"

  # Stable, always-reporting status for branch protection. Passes when both the
  # typecheck and docker jobs succeeded OR were skipped (services/ untouched);
  # fails if either failed.
  services-gate:
    name: services-gate
    needs: [changes, typecheck, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on service job results
        run: |
          tc="${{ needs.typecheck.result }}"
          dk="${{ needs.docker.result }}"
          echo "typecheck: $tc  docker: $dk  (services changed: ${{ needs.changes.outputs.services }})"
          for r in "$tc" "$dk"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::services pipeline failed"
              exit 1
            fi
          done
          echo "services-gate passed"
