name: secret-scan

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"  # Weekly Mon 05:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for the scheduled scan

      # Use the open-source gitleaks CLI directly, NOT gitleaks/gitleaks-action@v2:
      # that Action requires a paid GITLEAKS_LICENSE for org-owned repos (this repo
      # lives in the `haradid` org), so it fails before scanning. The CLI is the same
      # scanner, free, and auto-loads .gitleaks.toml from the repo root.
      #
      # Dev-default tokens (anvil #0 key, haraledger-dev-root, hara_dev_password) are
      # documented public fixtures and are allowlisted in .gitleaks.toml — not real
      # secrets. If gitleaks flags a new one, add it there.
      - name: Run gitleaks (open-source CLI)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --exit-code 1
