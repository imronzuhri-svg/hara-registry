name: hara-registry-chain

# Besu QBFT validator cluster.
#
# Deployment modes:
#   1. All 4 validators on one host (P0 smoke test):
#        docker compose -f docker-compose.yml up -d
#   2. One validator per host (P1a+ — recommended for real BFT):
#        On hara-v1:  VALIDATOR_ID=1 docker compose -f docker-compose.validator-only.yml up -d
#        On hara-v2:  VALIDATOR_ID=2 docker compose -f docker-compose.validator-only.yml up -d
#        ... etc
#
# The init container MUST run once before the validators (any host can host it).
# After init, validators fetch their key from Vault by VALIDATOR_ID.

x-besu-common: &besu-common
  build:
    context: ./node
    dockerfile: Dockerfile
    # See init service for rationale — host networking dodges the
    # wg-mesh-vs-docker-bridge 10.42.0.0/24 subnet conflict during build.
    network: host
  image: ${IMAGE_REGISTRY:-}hara-registry-node:${IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on:
    init:
      condition: service_completed_successfully

services:
  init:
    build:
      context: ./init
      dockerfile: Dockerfile
      # Use host networking for the build phase. Default BuildKit network
      # has the same conflict between WG mesh and docker bridge subnets
      # (both 10.42.0.0/24) that breaks outbound from container builds.
      # The host's network namespace works fine (verified by direct curl).
      # Runtime stays on the hara-platform bridge — only the build moves.
      network: host
    container_name: hara-init
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?required}
      VALIDATOR_COUNT: ${HARA_VALIDATOR_COUNT:-4}
      CHAIN_ID: ${HARA_CHAIN_ID:-131216}
      BLOCK_PERIOD_SECONDS: ${HARA_BLOCK_PERIOD_SECONDS:-2}
      # In multi-host production set VALIDATOR_IP_PREFIX=10.43.0.1 so
      # static-nodes.json gets baked with WG mesh IPs (not container
      # bridge IPs which only work on a single host). Defaults to
      # 10.42.0.1 (container IPs) for single-host sim.
      VALIDATOR_IP_PREFIX: ${VALIDATOR_IP_PREFIX:-10.42.0.1}
    volumes:
      - ./qbft-config.json:/work/qbft-config.json:ro
      - ./genesis:/work/genesis
      - ./generated:/work/generated
      - chain-shared:/shared
    networks:
      - hara-platform

  validator1:
    <<: *besu-common
    container_name: hara-validator1
    environment:
      VALIDATOR_ID: "1"
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?required}
    networks:
      hara-platform:
        ipv4_address: 10.42.0.11
    volumes:
      - validator1-data:/opt/besu/data
      - ./genesis:/opt/besu/genesis:ro
      - chain-shared:/shared:ro
      - ./scripts/start-validator.sh:/start-validator.sh:ro
    entrypoint: ["/bin/bash", "/start-validator.sh"]
    ports:
      - "${V1_P2P_BIND:-0.0.0.0:30303}:30303/tcp"
      - "${V1_P2P_BIND:-0.0.0.0:30303}:30303/udp"

  validator2:
    <<: *besu-common
    container_name: hara-validator2
    environment:
      VALIDATOR_ID: "2"
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?required}
    networks:
      hara-platform:
        ipv4_address: 10.42.0.12
    volumes:
      - validator2-data:/opt/besu/data
      - ./genesis:/opt/besu/genesis:ro
      - chain-shared:/shared:ro
      - ./scripts/start-validator.sh:/start-validator.sh:ro
    entrypoint: ["/bin/bash", "/start-validator.sh"]

  validator3:
    <<: *besu-common
    container_name: hara-validator3
    environment:
      VALIDATOR_ID: "3"
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?required}
    networks:
      hara-platform:
        ipv4_address: 10.42.0.13
    volumes:
      - validator3-data:/opt/besu/data
      - ./genesis:/opt/besu/genesis:ro
      - chain-shared:/shared:ro
      - ./scripts/start-validator.sh:/start-validator.sh:ro
    entrypoint: ["/bin/bash", "/start-validator.sh"]

  validator4:
    <<: *besu-common
    container_name: hara-validator4
    environment:
      VALIDATOR_ID: "4"
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?required}
    networks:
      hara-platform:
        ipv4_address: 10.42.0.14
    volumes:
      - validator4-data:/opt/besu/data
      - ./genesis:/opt/besu/genesis:ro
      - chain-shared:/shared:ro
      - ./scripts/start-validator.sh:/start-validator.sh:ro
    entrypoint: ["/bin/bash", "/start-validator.sh"]

networks:
  hara-platform:
    name: hara-platform
    external: true

volumes:
  validator1-data:
  validator2-data:
  validator3-data:
  validator4-data:
  # Explicit `name:` so this volume is reachable from other stacks
  # (deploy/rpc/, validator-only) without compose's project-name prefix.
  # Without it the volume becomes `hara-registry-chain_chain-shared` and an
  # `external: true` lookup of `chain-shared` from another stack fails.
  # Found by the 2026-05-26 sim dry-run.
  chain-shared:
    name: chain-shared
