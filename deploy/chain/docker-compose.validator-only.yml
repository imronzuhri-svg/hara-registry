name: hara-registry-validator

# Single-validator deploy — for P1a+ where each validator runs on its own VPS.
#
# Required env on each host:
#   VALIDATOR_ID=N           (1, 2, 3, or 4 — must be unique per host)
#   VAULT_DEV_ROOT_TOKEN     (or eventually Vault AppRole creds)
#   The genesis file + static-nodes/bootnodes config in /shared (copied from
#   the host that ran init — or fetched via init container at boot)

services:
  validator:
    build:
      context: ./node
      dockerfile: Dockerfile
      # Host networking for build to avoid the wg-mesh-vs-docker-bridge
      # 10.42.0.0/24 subnet conflict on Nevacloud VPSes.
      network: host
    image: ${IMAGE_REGISTRY:-}hara-registry-node:${IMAGE_TAG:-latest}
    container_name: hara-validator${VALIDATOR_ID:?VALIDATOR_ID required, 1-4}
    restart: unless-stopped
    environment:
      VALIDATOR_ID: ${VALIDATOR_ID}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?required}
    networks:
      hara-platform:
        ipv4_address: 10.42.0.1${VALIDATOR_ID}
    volumes:
      - validator-data:/opt/besu/data
      - ./genesis:/opt/besu/genesis:ro
      # Bind-mount ./shared instead of a named volume. In multi-host prod,
      # the chain-shared docker volume only exists on hara-stateful (where
      # chain init ran). Validator VPSes get static-nodes.json copied to
      # ./shared/static-nodes.json from MinIO via bringup-validators.sh.
      - ./shared:/shared:ro
      - ./scripts/start-validator.sh:/start-validator.sh:ro
    entrypoint: ["/bin/bash", "/start-validator.sh"]
    ports:
      # Bind P2P to the host's wg0 IP so peer validators can reach this
      # one over the WG mesh. Default 0.0.0.0 for sim/single-host; prod
      # sets VALIDATOR_P2P_BIND=10.43.0.X (this validator's wg IP).
      - "${VALIDATOR_P2P_BIND:-0.0.0.0:30303}:30303/tcp"
      - "${VALIDATOR_P2P_BIND:-0.0.0.0:30303}:30303/udp"

networks:
  hara-platform:
    name: hara-platform
    external: true

volumes:
  validator-data:
