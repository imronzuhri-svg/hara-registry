# Strata Console — deploy on hara-stateless-2 (alongside the other services).
#
#   docker compose -f docker-compose.console.yml up -d --build
#
# The edge Caddy (deploy/edge/Caddyfile, console.platform.haratrust.io site)
# fronts these: console.<host>/api/* -> hara-console-api, /* -> hara-console-web.
# Nothing here is published to the host — only Caddy reaches them on the
# hara-platform bridge. Internal data sources are reached over the WireGuard
# mesh (10.43.0.x).
name: hara-console

services:
  hara-console-api:
    image: ${IMAGE_REGISTRY:-}hara-registry-console-api:${CONSOLE_TAG:-latest}
    build:
      context: ../../console/server
    container_name: hara-console-api
    restart: unless-stopped
    networks: [hara-platform]
    environment:
      PORT: "8910"
      # Read-only sources over the WireGuard mesh:
      RPC_URL: ${CONSOLE_RPC_URL:-http://10.43.0.21:8545}
      PROMETHEUS_URL: ${CONSOLE_PROMETHEUS_URL:-http://10.43.0.25:9090}
      ALERTMANAGER_URL: ${CONSOLE_ALERTMANAGER_URL:-http://10.43.0.25:9093}
      VAULT_ADDR: ${CONSOLE_VAULT_ADDR:-http://10.43.0.40:8200}
      HAPROXY_STATS_URL: ${CONSOLE_HAPROXY_STATS_URL:-http://10.43.0.21:8404/stats;csv}
      INDEXER_METRICS_URL: ${CONSOLE_INDEXER_METRICS_URL:-http://10.43.0.25:9100/metrics}
      # backups-status agents (one per host running snapshot timers):
      BACKUPS_AGENT_URLS: ${CONSOLE_BACKUPS_AGENT_URLS:-http://10.43.0.40:8911/backups,http://10.43.0.11:8911/backups,http://10.43.0.12:8911/backups,http://10.43.0.13:8911/backups,http://10.43.0.14:8911/backups}
      # same-origin in prod, so CORS can stay tight (Caddy fronts both):
      CONSOLE_CORS_ORIGIN: ${CONSOLE_CORS_ORIGIN:-https://console.platform.haratrust.io}
      LOG_LEVEL: ${CONSOLE_LOG_LEVEL:-info}

  hara-console-web:
    image: ${IMAGE_REGISTRY:-}hara-registry-console-web:${CONSOLE_TAG:-latest}
    build:
      context: ../../console
    container_name: hara-console-web
    restart: unless-stopped
    networks: [hara-platform]

networks:
  hara-platform:
    external: true
