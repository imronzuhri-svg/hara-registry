# Strata Console — deploy on hara-stateless-2 (alongside the other services).
#
#   docker compose -f docker-compose.console.yml up -d --build
#
# The edge Caddy (deploy/edge/Caddyfile, console.platform.haratrust.io site)
# fronts these: console.<host>/api/* -> hara-console-api, /* -> hara-console-web.
# Nothing here is published to the host — only Caddy reaches them on the
# hara-platform bridge. Internal data sources are reached over the WireGuard
# mesh (10.43.0.x).
name: hara-console

services:
  hara-console-api:
    image: ${IMAGE_REGISTRY:-}hara-registry-console-api:${CONSOLE_TAG:-latest}
    build:
      context: ../../console/server
    container_name: hara-console-api
    restart: unless-stopped
    networks: [hara-platform]
    environment:
      PORT: "8910"
      # SAME-HOST sources (also on hara-stateless-2's hara-platform bridge) →
      # reach by container name. Their host ports publish on 127.0.0.1 only, so
      # the mesh IP would not work from inside the bridge.
      PROMETHEUS_URL: ${CONSOLE_PROMETHEUS_URL:-http://hara-prometheus:9090}
      ALERTMANAGER_URL: ${CONSOLE_ALERTMANAGER_URL:-http://hara-alertmanager:9093}
      INDEXER_METRICS_URL: ${CONSOLE_INDEXER_METRICS_URL:-http://hara-indexer:9100/metrics}
      # CROSS-HOST sources → reach over the WireGuard mesh (host WG IP + a
      # port published on that interface).
      RPC_URL: ${CONSOLE_RPC_URL:-http://10.43.0.21:8545}
      VAULT_ADDR: ${CONSOLE_VAULT_ADDR:-http://10.43.0.40:8200}
      # NOTE: hara-lb publishes stats on 127.0.0.1:8404 only — not reachable
      # cross-host. To light up the RPC-tier panel, publish 8404 on hara-rpc-1's
      # wg0 IP (10.43.0.21:8404) and keep this default.
      HAPROXY_STATS_URL: ${CONSOLE_HAPROXY_STATS_URL:-http://10.43.0.21:8404/;csv}
      # backups-status agents (one per host running snapshot timers):
      BACKUPS_AGENT_URLS: ${CONSOLE_BACKUPS_AGENT_URLS:-http://10.43.0.40:8911/backups,http://10.43.0.11:8911/backups,http://10.43.0.12:8911/backups,http://10.43.0.13:8911/backups,http://10.43.0.14:8911/backups}
      # same-origin in prod, so CORS can stay tight (Caddy fronts both):
      CONSOLE_CORS_ORIGIN: ${CONSOLE_CORS_ORIGIN:-https://console.platform.haratrust.io}
      LOG_LEVEL: ${CONSOLE_LOG_LEVEL:-info}
      AUDIT_PATH: /data/audit.jsonl
      # Phase 4 copilot (optional, Kimi/Moonshot by default — OpenAI-compatible).
      # Set CONSOLE_COPILOT_API_KEY to enable; without it /api/copilot returns 503.
      COPILOT_API_KEY: ${CONSOLE_COPILOT_API_KEY:-}
      COPILOT_BASE_URL: ${CONSOLE_COPILOT_BASE_URL:-https://api.moonshot.ai/v1}
      # Default to a fast (non-reasoning) Kimi/Moonshot model for snappy chat
      # (~5s). Override to kimi-k2.6 for deeper reasoning (slower, ~60s).
      COPILOT_MODEL: ${CONSOLE_COPILOT_MODEL:-moonshot-v1-128k}
    volumes:
      - console-audit:/data   # append-only P1 proposal audit log (persists across restarts)

  hara-console-web:
    image: ${IMAGE_REGISTRY:-}hara-registry-console-web:${CONSOLE_TAG:-latest}
    build:
      context: ../../console
    container_name: hara-console-web
    restart: unless-stopped
    networks: [hara-platform]

volumes:
  console-audit:

networks:
  hara-platform:
    external: true
