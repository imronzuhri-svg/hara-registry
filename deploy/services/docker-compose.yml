name: hara-ledger-services

# Application services: signer, broadcaster, indexer, rpc-cache, Blockscout (BE + FE).
# In production runs on its own VPS, or co-locates with rpc/ on smaller deployments.
#
# IP plan (per deploy/topology.md §3):
#   .40 reserved for hara-vault     (deploy/platform/docker-compose.secrets.yml)
#   .42 reserved for hara-minio     (deploy/data/docker-compose.minio.yml)
# Services tier therefore lives in .41 + .43–.47 below.

services:
  migrate:
    build:
      context: ../../services
      dockerfile: migrate/Dockerfile
    image: ${IMAGE_REGISTRY:-}hara-ledger-migrate:${IMAGE_TAG:-latest}
    container_name: hara-migrate
    networks: [hara-platform]
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-hara_indexer}
      LOG_LEVEL: info
    restart: "no"

  signer:
    build:
      context: ../../services
      dockerfile: signer/Dockerfile
    image: ${IMAGE_REGISTRY:-}hara-ledger-signer:${IMAGE_TAG:-latest}
    container_name: hara-signer
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.41   # was .40 — collided with hara-vault
    environment:
      SERVICE_NAME: signer
      SIGNER_PORT: 7000
      HARA_CHAIN_ID: ${HARA_CHAIN_ID:-131216}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?required}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-hara_indexer}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RPC_READ_URL: http://lb:8545/rpc/read
      LOG_LEVEL: info
    ports:
      - "${SIGNER_BIND:-127.0.0.1:7000}:7000"
    depends_on:
      migrate: { condition: service_completed_successfully }

  broadcaster:
    build:
      context: ../../services
      dockerfile: broadcaster/Dockerfile
    image: ${IMAGE_REGISTRY:-}hara-ledger-broadcaster:${IMAGE_TAG:-latest}
    container_name: hara-broadcaster
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.43   # was .41 — bumped after signer moved to .41
    environment:
      SERVICE_NAME: broadcaster
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-hara_indexer}
      REDIS_HOST: ${REDIS_HOST:-redis}
      RPC_WRITE_URL: http://lb:8545/rpc/write
      RPC_READ_URL: http://lb:8545/rpc/read
      LOG_LEVEL: info
    depends_on:
      migrate: { condition: service_completed_successfully }
      signer:  { condition: service_started }

  indexer:
    build:
      context: ../../services
      dockerfile: indexer/Dockerfile
    image: ${IMAGE_REGISTRY:-}hara-ledger-indexer:${IMAGE_TAG:-latest}
    container_name: hara-indexer
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.44   # was .42 — collided with hara-minio
    environment:
      SERVICE_NAME: indexer
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-hara_indexer}
      RPC_READ_URL: http://lb:8545/rpc/read
      METRICS_PORT: 9100
      POLL_INTERVAL_MS: 1000
      BATCH_SIZE: 500
      CONFIRMATIONS: 1
      LOG_LEVEL: info
    ports:
      - "${INDEXER_METRICS_BIND:-127.0.0.1:9100}:9100"
    depends_on:
      migrate: { condition: service_completed_successfully }

  rpc-cache:
    build:
      context: ../../services
      dockerfile: rpc-cache/Dockerfile
    image: ${IMAGE_REGISTRY:-}hara-ledger-rpc-cache:${IMAGE_TAG:-latest}
    container_name: hara-rpc-cache
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.45   # was .47 — consolidated with services tier block
    environment:
      SERVICE_NAME: rpc-cache
      PORT: 8080
      UPSTREAM_RPC: http://lb:8545/rpc/read
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_DB: 5
      WARMUP_ON_START: "true"
      LOG_LEVEL: info
    ports:
      - "${RPC_CACHE_BIND:-0.0.0.0:8088}:8080"

  # PQ anchor worker. Runs on a 10-min cadence (default), produces ML-DSA-65
  # signed Merkle anchors over indexed_events, PUTs the signature blob to
  # MinIO (hara-pq-anchors bucket), and commits keccak256(sig) on-chain via
  # PQAnchorRegistry. See services/anchor-worker/src/index.ts §header.
  #
  # Requires:
  #   • A pre-funded ECDSA wallet (refuses to start with zero balance).
  #   • PQAnchorRegistry deployed and its address in PQ_ANCHOR_REGISTRY_ADDRESS.
  #     Pull this from chain/deploy/broadcast/DeployPQAnchor.s.sol/<chain>/run-latest.json
  #     or set explicitly post-deploy.
  #   • MinIO bucket `hara-pq-anchors` (created by minio-init in docker-compose.minio.yml).
  anchor-worker:
    build:
      context: ../../services
      dockerfile: anchor-worker/Dockerfile
    image: ${IMAGE_REGISTRY:-}hara-ledger-anchor-worker:${IMAGE_TAG:-latest}
    container_name: hara-anchor-worker
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.48
    environment:
      SERVICE_NAME: anchor-worker
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN:?required}
      ANCHOR_VAULT_PATH: secret/haraledger/signer-keys/anchor-worker
      DATABASE_URL: postgresql://${POSTGRES_USER:?required}:${POSTGRES_PASSWORD:?required}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-hara_indexer}
      RPC_READ_URL: http://lb:8545/rpc/read
      RPC_WRITE_URL: http://lb:8545/rpc/write
      CHAIN_ID: ${HARA_CHAIN_ID:-131216}
      PQ_ANCHOR_REGISTRY_ADDRESS: ${PQ_ANCHOR_REGISTRY_ADDRESS:?required — set after PQAnchorRegistry deploy}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-hara-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      PQ_BUCKET: hara-pq-anchors
      ANCHOR_INTERVAL_MS: ${ANCHOR_INTERVAL_MS:-600000}
      METRICS_PORT: 9102
      LOG_LEVEL: info
    ports:
      - "${ANCHOR_METRICS_BIND:-127.0.0.1:9102}:9102"
    depends_on:
      migrate: { condition: service_completed_successfully }

  blockscout-db-init:
    image: postgres:16-alpine
    container_name: hara-blockscout-db-init
    networks: [hara-platform]
    environment:
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGUSER: ${POSTGRES_USER:?required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ./blockscout/init-db.sh:/init-db.sh:ro
    entrypoint: ["sh", "/init-db.sh"]
    restart: "no"

  blockscout:
    image: blockscout/blockscout:6.10.1
    container_name: hara-blockscout
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.46   # was .43 — bumped to free .43 for broadcaster
    env_file: [./blockscout/envs/common-blockscout.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/blockscout
    command:
      - sh
      - -c
      - bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start
    ports:
      - "${BLOCKSCOUT_BE_BIND:-127.0.0.1:4000}:4000"
    depends_on:
      blockscout-db-init: { condition: service_completed_successfully }

  blockscout-fe:
    image: ghcr.io/blockscout/frontend:v1.37.1
    container_name: hara-blockscout-fe
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.47   # was .44 — bumped to free .44 for indexer
    env_file: [./blockscout/envs/common-frontend.env]
    ports:
      - "${BLOCKSCOUT_FE_BIND:-0.0.0.0:4010}:3000"
    depends_on: [blockscout]

networks:
  hara-platform:
    name: hara-platform
    external: true
