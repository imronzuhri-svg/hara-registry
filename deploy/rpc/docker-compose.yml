name: hara-ledger-rpc

# RPC mesh — read replicas, write node, and the HAProxy LB in front of them.
# In production this can run on its own VPS or co-locate with services/.

x-besu-common: &besu-common
  build:
    context: ../chain/node
    dockerfile: Dockerfile
    # Host networking for build — see deploy/chain/docker-compose.yml for
    # the full rationale (wg-mesh / docker-bridge subnet conflict on
    # Nevacloud VPSes that breaks BuildKit's default network).
    network: host
  image: ${IMAGE_REGISTRY:-}hara-ledger-node:${IMAGE_TAG:-latest}
  # When IMAGE_REGISTRY=ghcr.io/imronzuhri-svg/ is set, compose tries to pull
  # first; GHCR doesn't have hara-ledger-node yet, pull fails with "denied",
  # then falls through to the build above. Falls through cleanly with
  # `docker compose up --build` or after a one-time `docker compose build`.
  restart: unless-stopped
  networks:
    - hara-platform
  # Real RPC healthcheck (2026-05-28): the base image's built-in check passes
  # even when the Vert.x JSON-RPC listener has deadlocked (worker-pool
  # exhaustion) — which is why hung nodes kept showing "(healthy)". This one
  # actually POSTs eth_blockNumber, so a wedged listener goes "unhealthy".
  # Paired with the autoheal sidecar below (plain Docker does NOT restart on
  # unhealthy — only on exit), a wedged node self-recovers in ~1 min instead
  # of sitting dead until a human notices. (curl is in the image — the
  # validator entrypoint uses it for Vault.)
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        curl -fsS -m 8 -X POST -H 'Content-Type: application/json'
        --data '{"jsonrpc":"2.0","method":"eth_blockNumber","id":1}'
        http://localhost:8545 | grep -q '"result"' || exit 1
    interval: 15s
    timeout: 10s
    retries: 4
    start_period: 180s
  labels:
    autoheal: "true"

services:
  rpc-read-1:
    <<: *besu-common
    container_name: hara-rpc-read-1
    environment:
      VALIDATOR_ID: "rpc-read-1"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.22   # was .21 — freed for LB read-binding plan
    volumes:
      - rpc-read-1-data:/opt/besu/data
      - ../chain/genesis:/opt/besu/genesis:ro
      - ../chain/shared:/shared:ro
      - ./scripts/start-rpc.sh:/start-rpc.sh:ro
    entrypoint: ["/bin/bash", "/start-rpc.sh"]

  rpc-read-2:
    <<: *besu-common
    container_name: hara-rpc-read-2
    environment:
      VALIDATOR_ID: "rpc-read-2"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.23   # bumped to keep upstream block contiguous
    volumes:
      - rpc-read-2-data:/opt/besu/data
      - ../chain/genesis:/opt/besu/genesis:ro
      - ../chain/shared:/shared:ro
      - ./scripts/start-rpc.sh:/start-rpc.sh:ro
    entrypoint: ["/bin/bash", "/start-rpc.sh"]

  rpc-write:
    <<: *besu-common
    container_name: hara-rpc-write
    environment:
      VALIDATOR_ID: "rpc-write"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.24   # bumped to keep upstream block contiguous
    volumes:
      - rpc-write-data:/opt/besu/data
      - ../chain/genesis:/opt/besu/genesis:ro
      - ../chain/shared:/shared:ro
      - ./scripts/start-rpc.sh:/start-rpc.sh:ro
    entrypoint: ["/bin/bash", "/start-rpc.sh"]

  lb:
    image: haproxy:2.9-alpine
    container_name: hara-lb
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.20   # was .30 — collided with hara-postgres
    volumes:
      - ./lb/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${RPC_HTTP_BIND:-0.0.0.0:8545}:8545"
      - "${RPC_WS_BIND:-0.0.0.0:8546}:8546"
      - "${HAPROXY_STATS_BIND:-127.0.0.1:8404}:8404"
    depends_on:
      rpc-read-1: { condition: service_started }
      rpc-read-2: { condition: service_started }
      rpc-write:  { condition: service_started }

  # Watchdog: restarts any container marked "unhealthy" that carries the
  # autoheal=true label (the three besu nodes). This is what turns the new
  # RPC healthcheck into actual self-healing — plain Docker won't restart on
  # unhealthy, only on exit. A wedged JSON-RPC listener now recovers in ~1 min.
  # Mounts docker.sock (root-equivalent) — acceptable on internal permissioned
  # infra; if that's a concern, replace with a host systemd timer running the
  # probe-and-restart playbook from memory:rpc-node-hang-bug.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: hara-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"        # check every 10s
      AUTOHEAL_START_PERIOD: "180"   # ignore health for 180s after a (re)start
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: "30"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  hara-platform:
    name: hara-platform
    external: true

volumes:
  rpc-read-1-data:
  rpc-read-2-data:
  rpc-write-data:
