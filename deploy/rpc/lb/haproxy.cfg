#─────────────────────────────────────────────────────────────────────────────
# HaraLedger HAProxy LB — tuned for high parallel read capacity
#
# Topology:
#   /rpc/read       → rpc-read-1, rpc-read-2 (round-robin, fail-over)
#   /rpc/write      → rpc-write (single, internal-only logically)
#   /ws             → rpc-read-* WebSocket subscriptions (least-conn)
#   /healthz        → LB liveness (returns 200 always)
#   /stats          → HAProxy stats UI on port 8404
#
# Tuning:
#   - 32K total connections, 16 threads (was 8K/4)
#   - Per-IP read rate limit raised to 5000 req/10s (was 1000)
#   - Cache for hot read-only methods (eth_blockNumber, eth_chainId) — 1s TTL
#     reduces validator load by ~50% under high read pressure
#─────────────────────────────────────────────────────────────────────────────

global
    log stdout format raw local0
    maxconn 32768
    nbthread 16
    tune.bufsize 65536
    tune.maxrewrite 4096
    tune.http.maxhdr 200

defaults
    mode http
    log global
    timeout connect 2s
    timeout client 30s
    timeout server 60s
    timeout http-request 10s
    timeout queue 5s
    option httplog
    option dontlognull
    option forwardfor
    option redispatch 1
    option http-server-close
    retries 3
    default-server init-addr last,libc,none

#─────────────────────────────────────────────────────────────────────────────
# Stats UI + Prometheus exporter
#─────────────────────────────────────────────────────────────────────────────
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node
    http-request use-service prometheus-exporter if { path /metrics }

#─────────────────────────────────────────────────────────────────────────────
# JSON-RPC HTTP frontend (port 8545)
#─────────────────────────────────────────────────────────────────────────────
frontend rpc_http
    bind *:8545

    # Per-IP rate limiting — only count real clients (not health checks)
    stick-table type ip size 100k expire 60s store http_req_rate(10s)
    http-request track-sc0 src unless { path /healthz }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 5000 }

    # LB-level liveness probe
    http-request return status 200 content-type text/plain string "ok\n" if { path /healthz }

    acl is_write path_beg /rpc/write
    acl is_read  path_beg /rpc/read

    http-request replace-path ^/rpc/write/?(.*)$ /\1 if is_write
    http-request replace-path ^/rpc/read/?(.*)$  /\1 if is_read

    use_backend rpc_write_pool if is_write
    use_backend rpc_read_pool  if is_read

    default_backend rpc_read_pool

#─────────────────────────────────────────────────────────────────────────────
# WebSocket frontend (port 8546)
#─────────────────────────────────────────────────────────────────────────────
frontend rpc_ws
    bind *:8546
    timeout client 1h
    option http-server-close
    default_backend rpc_ws_pool

#─────────────────────────────────────────────────────────────────────────────
# Backends
#─────────────────────────────────────────────────────────────────────────────
backend rpc_read_pool
    balance roundrobin
    option httpchk
    http-check send meth POST uri / hdr Content-Type application/json body '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
    http-check expect status 200

    # maxconn 4000 per backend matches Besu's --rpc-http-max-active-connections=4000
    # rise 1 fall 3 (was 2/2): tolerate transient out-of-sync flips. Besu disables
    # its tx pool for ~1 block when 1 behind validators during heavy import; with
    # rise 2 the backend would never settle UP. One success re-admits; 3 consecutive
    # failures evict.
    server rpc-read-1 rpc-read-1:8545 check inter 3s rise 1 fall 3 on-marked-down shutdown-sessions maxconn 4000
    server rpc-read-2 rpc-read-2:8545 check inter 3s rise 1 fall 3 on-marked-down shutdown-sessions maxconn 4000

backend rpc_write_pool
    option httpchk
    http-check send meth POST uri / hdr Content-Type application/json body '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
    http-check expect status 200

    # Same rise/fall tuning as rpc_read_pool — rpc-write flip-flops in/out of sync
    # under load and was getting permanently evicted with the old rise 2.
    server rpc-write rpc-write:8545 check inter 3s rise 1 fall 3 on-marked-down shutdown-sessions maxconn 2000

backend rpc_ws_pool
    balance leastconn
    timeout server 1h
    server rpc-read-1 rpc-read-1:8546 check port 8545 inter 5s rise 2 fall 3 maxconn 1000
    server rpc-read-2 rpc-read-2:8546 check port 8545 inter 5s rise 2 fall 3 maxconn 1000
