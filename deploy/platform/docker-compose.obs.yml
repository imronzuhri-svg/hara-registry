name: hara-platform-obs

# Observability tier — Prometheus, Alertmanager, alert-sink, Loki, Promtail,
# Grafana. In production this runs on the `hara-stateless` VPS (see
# deploy/topology.md §2.3). In local dev, docker-compose.yml bundles all of
# these alongside Vault.
#
# Vault is intentionally NOT in this file — secrets live on hara-stateful in
# Raft mode (see docker-compose.secrets.yml).

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: hara-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-90d}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROM_BIND:-127.0.0.1:9090}:9090"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hara-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=info"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND:-127.0.0.1:9093}:9093"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.4
    depends_on: [alert-sink]

  alert-sink:
    build:
      context: ./alert-sink
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-}hara-alert-sink:${IMAGE_TAG:-latest}
    container_name: hara-alert-sink
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.5

  loki:
    image: grafana/loki:3.2.0
    container_name: hara-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_BIND:-127.0.0.1:3201}:3100"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.6

  promtail:
    image: grafana/promtail:3.2.0
    container_name: hara-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail-positions:/tmp
    networks:
      hara-platform:
        ipv4_address: 10.42.0.8
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: hara-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3200}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-0.0.0.0:3200}:3000"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.7
    depends_on: [prometheus]

  # Tempo — distributed-trace store, sink for OTLP from the TS services
  # (signer / broadcaster / indexer / rpc-cache / anchor-worker).
  # Services emit via `@hara/shared/otel`, which is a no-op unless
  # OTEL_EXPORTER_OTLP_ENDPOINT is set in their env (e.g. http://tempo:4318).
  tempo:
    image: grafana/tempo:2.6.1
    container_name: hara-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      # 4318 = OTLP/HTTP — what @opentelemetry/exporter-trace-otlp-http speaks
      - "${TEMPO_OTLP_HTTP_BIND:-127.0.0.1:4318}:4318"
      # 3200 internal Tempo query API — exposed only to Grafana via the mesh
    networks:
      hara-platform:
        ipv4_address: 10.42.0.9

networks:
  hara-platform:
    name: hara-platform
    # In multi-host (WireGuard mesh) production, this is external — created
    # out-of-band by deploy/ops/wg-bootstrap.sh on a Swarm overlay or
    # equivalent. In single-host smoke-test, the secrets file creates it.
    external: true

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  promtail-positions:
  tempo-data:
