global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    cluster: hara-ledger-local
    phase: P0

rule_files:
  - /etc/prometheus/rules/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Besu validators
  - job_name: besu-validators
    static_configs:
      - targets:
          - validator1:9545
          - validator2:9545
          - validator3:9545
          - validator4:9545
        labels:
          role: validator
          tier: chain

  # Besu RPC tier (split per L1)
  - job_name: besu-rpc-read
    static_configs:
      - targets:
          - rpc-read-1:9545
          - rpc-read-2:9545
        labels:
          role: rpc
          mode: read
          tier: rpc

  - job_name: besu-rpc-write
    static_configs:
      - targets:
          - rpc-write:9545
        labels:
          role: rpc
          mode: write
          tier: rpc

  # HAProxy load balancer — built-in /metrics endpoint
  - job_name: haproxy
    metrics_path: /metrics
    static_configs:
      - targets:
          - lb:8404
        labels:
          role: lb
          tier: edge

  # Indexer (L3)
  - job_name: indexer
    metrics_path: /metrics
    static_configs:
      - targets:
          - indexer:9100
        labels:
          role: indexer
          tier: services

  # Blockscout backend (L5) — Phoenix prometheus_telemetry plugin
  - job_name: blockscout
    metrics_path: /metrics
    static_configs:
      - targets:
          - blockscout:4000
        labels:
          role: blockscout
          tier: services
          project: hara-ledger

  # RPC read cache — hit/miss rate, upstream latency, key count
  - job_name: rpc-cache
    metrics_path: /metrics
    static_configs:
      - targets:
          - rpc-cache:8080
        labels:
          role: rpc-cache
          tier: services
          project: hara-ledger

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
