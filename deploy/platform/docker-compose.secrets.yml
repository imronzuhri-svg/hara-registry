name: hara-platform-secrets

# Secrets-tier compose for production.
# Deployed on the `hara-stateful` VPS (see deploy/topology.md §2.2).
#
# Splits Vault out of the bundled dev-mode docker-compose.yml so it can:
#   • Run in Raft (integrated storage) mode for HA-ready persistence
#   • Persist /vault/data to a named volume (survives container/VPS restart)
#   • Live on a different VPS from the observability stack
#
# Local dev keeps using deploy/platform/docker-compose.yml (server -dev).
# This file is NOT for local dev — it requires a manual unseal step on first
# boot (see deploy/ops/vault-raft-init.sh).

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: hara-vault
    restart: unless-stopped

    # mlock keeps Vault's encryption keys out of swap. Without IPC_LOCK
    # the Raft backend refuses to start.
    cap_add: [IPC_LOCK]

    # Raft mode: no VAULT_DEV_* envs. Vault boots SEALED on first start;
    # operator must run `vault operator init` then `vault operator unseal`
    # three times with the keys returned by init. See vault-raft-init.sh.
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://10.42.0.40:8200
      VAULT_CLUSTER_ADDR: http://10.42.0.40:8201

    command: server -config=/vault/config/vault.hcl

    volumes:
      - ./vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/data

    ports:
      # Public binding — usually only the WireGuard side. The default below
      # exposes on localhost so the operator can SSH-tunnel for ops tasks.
      - "${VAULT_BIND:-127.0.0.1:8200}:8200"
      - "${VAULT_CLUSTER_BIND:-127.0.0.1:8201}:8201"

    networks:
      hara-platform:
        ipv4_address: 10.42.0.40   # matches topology.md WG plan

    healthcheck:
      # `vault status` returns:
      #   exit 0 = unsealed + active
      #   exit 1 = error / not initialised
      #   exit 2 = sealed (expected before first unseal)
      # We accept either 0 or 2 — sealed-but-running is a valid state; it
      # means an operator needs to unseal, not that the container is broken.
      test: ["CMD-SHELL", "vault status; rc=$?; [ $rc -eq 0 ] || [ $rc -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  hara-platform:
    name: hara-platform
    # In single-host deploys (smoke test on one VPS), this stack creates the
    # network. In multi-host (WireGuard mesh + Swarm overlay) it is external,
    # created out-of-band by the wg-bootstrap step.
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.0.0/24
          gateway: 10.42.0.1
    # external: true

volumes:
  vault-data:
    # Keeping Raft state on a named docker volume on hara-stateful's 1 TB
    # NVMe. Backup is via `vault operator raft snapshot save` from
    # deploy/ops/vault-raft-snapshot.sh (cron'd nightly, uploaded to object
    # storage). Restoring is `vault operator raft snapshot restore`.
