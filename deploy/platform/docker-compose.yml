name: hara-platform

# LOCAL DEV ONLY — bundled platform stack (Vault in dev-mode + observability).
#
# This file exists so a single `docker compose up -d` brings the whole
# platform tier up on one host without the Vault Raft init ritual. It is
# the convenient path for developer machines and single-VPS smoke tests.
#
# For 6-VPS production rollout, this file is NOT used. Instead:
#   • docker-compose.secrets.yml  → runs on hara-stateful (Vault Raft mode)
#   • docker-compose.obs.yml      → runs on hara-stateless (Prom/Graf/etc.)
# See deploy/topology.md §2 + §5.
#
# Bring up FIRST in local dev — every other stack joins the hara-platform
# network and needs Vault healthy before they can fetch keys.

services:
  vault:
    image: hashicorp/vault:1.17
    container_name: hara-vault
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?VAULT_DEV_ROOT_TOKEN required}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://0.0.0.0:8200
    command: server -dev
    ports:
      - "${VAULT_BIND:-0.0.0.0:8200}:8200"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.2
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: hara-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION:-90d}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/rules/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROM_BIND:-127.0.0.1:9090}:9090"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.3

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hara-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=info"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_BIND:-127.0.0.1:9093}:9093"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.4
    depends_on: [alert-sink]

  alert-sink:
    build:
      context: ./alert-sink
      dockerfile: Dockerfile
    image: ${IMAGE_REGISTRY:-}hara-alert-sink:${IMAGE_TAG:-latest}
    container_name: hara-alert-sink
    restart: unless-stopped
    networks:
      hara-platform:
        ipv4_address: 10.42.0.5

  loki:
    image: grafana/loki:3.2.0
    container_name: hara-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "${LOKI_BIND:-127.0.0.1:3201}:3100"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.6

  promtail:
    image: grafana/promtail:3.2.0
    container_name: hara-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - promtail-positions:/tmp
    networks:
      hara-platform:
        ipv4_address: 10.42.0.8
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: hara-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3200}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-0.0.0.0:3200}:3000"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.7
    depends_on: [prometheus]

networks:
  hara-platform:
    name: hara-platform
    # In single-host deployments, this stack CREATES the network (bridge).
    # In multi-host deployments, comment out the `driver` line and uncomment
    # the `external` line — the swarm overlay is created out-of-band.
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.0.0/24
          gateway: 10.42.0.1
    # external: true

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
  promtail-positions:
