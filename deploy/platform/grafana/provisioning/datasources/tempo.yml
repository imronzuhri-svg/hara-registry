apiVersion: 1

datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    # Tempo's query API on the hara-platform overlay (mesh-internal only).
    # Services emit OTLP/HTTP traces to tempo:4318 (set via
    # OTEL_EXPORTER_OTLP_ENDPOINT in their service env); Grafana reads
    # back via :3200.
    url: http://tempo:3200
    editable: false
    jsonData:
      # Wire trace ↔ log correlation: clicking a span in Grafana opens
      # the matching logs in Loki, filtered by service.name + traceID.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags:
          - { key: service.name, value: service_name }
        filterByTraceID: true
        filterBySpanID: false
      # Wire span ↔ metric correlation for RED-style drilldowns.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - { key: service.name, value: service_name }
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
