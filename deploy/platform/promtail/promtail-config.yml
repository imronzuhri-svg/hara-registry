# hara-platform — Promtail
# Scrapes Docker container logs from every project (hara-ledger, hara-did,
# hara-xchange, ...) and ships to Loki. Per-project filtering happens via the
# `project` label, derived from the compose project name.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name (without leading slash)
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Service name from compose
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      # Project name from compose — lets you filter logs per cluster
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: project
      # stdout vs stderr
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - target_label: cluster
        replacement: hara-platform-local
    pipeline_stages:
      - docker: {}
