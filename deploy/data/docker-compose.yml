name: hara-ledger-data

# Data tier — Postgres + Redis. In production runs on its own VPS with
# dedicated NVMe storage and daily backups to off-host object storage.
# Phase 2 of the platform consolidation will move these into deploy/platform/.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-hara_indexer}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5432}:5432"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.30   # was .45 — aligned with topology.md §3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1500MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "maintenance_work_mem=256MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"   # NVMe
      - "-c"
      - "log_min_duration_statement=500"  # log slow queries

  redis:
    image: redis:7-alpine
    container_name: hara-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_BIND:-127.0.0.1:6379}:6379"
    networks:
      hara-platform:
        ipv4_address: 10.42.0.31   # was .46 — aligned with topology.md §3
    command:
      - "redis-server"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-512mb}"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - "60 1000"        # snapshot every 60s if 1000+ writes
      # Disable FLUSHALL (production safety). The `--rename-command` CLI flag
      # takes TWO separate args (command name + new name); collapsing them into
      # one token "FLUSHALL \"\"" makes Redis 7+ refuse to start with
      # "Bad directive or wrong number of arguments". Caught by the 2026-05-26
      # dry-run.
      - "--rename-command"
      - "FLUSHALL"
      - ""

networks:
  hara-platform:
    name: hara-platform
    external: true

volumes:
  postgres-data:
  redis-data:
