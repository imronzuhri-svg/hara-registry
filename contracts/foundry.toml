[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = false

# Chain ID matches HaraLedger local dev
chain_id = 131216

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
local = "http://localhost:8545"
