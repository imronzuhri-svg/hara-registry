# Echidna configuration for HaraLedger property tests.
#
# Run locally:
#   docker run --rm -v "$PWD:/work" -w /work \
#     ghcr.io/crytic/echidna/echidna:v2.2.5 \
#     echidna test-fuzz/HaraPalmOilFuzz.sol --contract HaraPalmOilFuzz --config echidna.config.yaml
#
# Or via CI (.github/workflows/echidna.yml).

# Fuzz iteration budget per harness. ~10k ≈ 30 s of CPU.
testLimit: 10000

# Use property mode (the `echidna_*` functions returning bool). Earlier
# `assertion` mode silently ignores those — was the reason the first run
# reported the deploy as the *only* failure: nothing else ever ran.
testMode: property

# Coverage-guided mutation — prioritises inputs that hit new branches.
coverage: true
